services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: logia
      POSTGRES_PASSWORD: logia
      POSTGRES_DB: logia
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - logia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logia -d logia"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  logia-postgres:
